experiment:
  name: medvision_cxr_densenet121_baseline
  output_dir: outputs/densenet121_baseline
  seed: 42
  use_mlflow: true

data:
  train_csv: data/processed/train.csv
  valid_csv: data/processed/valid.csv
  test_csv: data/processed/test.csv
  image_root: data/images
  image_size: 320
  in_channels: 3
  use_clahe: false
  num_workers: 4
  pin_memory: true
  quality_checks:
    min_size: 224
    min_std: 8.0
    max_blank_ratio: 0.92
  labels:
    - Atelectasis
    - Cardiomegaly
    - Consolidation
    - Edema
    - Pleural Effusion
    - Pneumonia
    - Pneumothorax
    - Lung Opacity
    - Enlarged Cardiomediastinum
    - Fracture
    - Support Devices
    - No Finding
  chexpert_label_mapping:
    positive: 1.0
    negative: 0.0
    uncertain_strategy: ignore
    blank_strategy: ignore

model:
  name: densenet121
  pretrained: true
  dropout: 0.2

train:
  batch_size: 16
  epochs: 15
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: reduce_on_plateau
  scheduler_patience: 2
  scheduler_factor: 0.5
  mixed_precision: true
  early_stopping_patience: 5
  gradient_clip_norm: 1.0
  pos_weight_strategy: balanced

evaluation:
  default_threshold: 0.5
  threshold_search_metric: f1
  export_error_cases: true
  calibration_bins: 10

inference:
  overall_risk_thresholds:
    critical: 0.85
    high: 0.65
    medium: 0.35
  uncertainty_margin: 0.1
  uncertainty_entropy_threshold: 0.65

export:
  formats:
    - torchscript
    - onnx
  onnx_opset: 17
