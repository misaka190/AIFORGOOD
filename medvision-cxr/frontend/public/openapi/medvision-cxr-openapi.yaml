openapi: 3.1.0
info:
  title: MedVision-CXR Backend
  version: 0.1.0
  summary: OpenAPI 3.1 specification for the MedVision-CXR backend
  description: MedVision-CXR is an AI-assisted chest X-ray triage system. This specification
    covers authentication, upload, AI-assisted risk assessment, Grad-CAM, doctor review,
    audit logs, model metadata, direct delete, health, and the governed deletion approval
    workflow.
paths:
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Register
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Get Me
      operationId: get_me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/cxr/upload:
    post:
      tags:
      - cxr
      summary: Upload Cxr
      operationId: upload_cxr_api_v1_cxr_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_cxr_api_v1_cxr_upload_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/cxr/{image_id}/analyze:
    post:
      tags:
      - cxr
      summary: Analyze Cxr
      operationId: analyze_cxr_api_v1_cxr__image_id__analyze_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          type: string
          title: Image Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cxr/{image_id}/gradcam:
    post:
      tags:
      - cxr
      summary: Generate Gradcam
      operationId: generate_gradcam_api_v1_cxr__image_id__gradcam_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          type: string
          title: Image Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradCAMRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradCAMGenerateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cxr/results/{prediction_id}:
    get:
      tags:
      - cxr
      summary: Get Prediction Result
      operationId: get_prediction_result_api_v1_cxr_results__prediction_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: prediction_id
        in: path
        required: true
        schema:
          type: string
          title: Prediction Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResultOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cxr/history:
    get:
      tags:
      - cxr
      summary: Get History
      operationId: get_history_api_v1_cxr_history_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/cxr/{image_id}/heatmap:
    get:
      tags:
      - cxr
      summary: Get Heatmap
      operationId: get_heatmap_api_v1_cxr__image_id__heatmap_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          type: string
          title: Image Id
      - name: label
        in: query
        required: true
        schema:
          type: string
          title: Label
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cxr/{image_id}:
    delete:
      tags:
      - cxr
      summary: Delete Cxr Image
      operationId: delete_cxr_image_api_v1_cxr__image_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          type: string
          title: Image Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteImageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteImageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/audit/logs:
    get:
      tags:
      - audit
      summary: List audit logs
      description: 列出系统审计日志。支持按 action_type、resource_type、request_id、actor_user_id
        过滤。仅 doctor/admin 可访问。
      operationId: get_audit_logs_api_v1_audit_logs_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: action_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action Type
      - name: resource_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Type
      - name: request_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      - name: actor_user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Actor User Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Audit logs returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '403':
          description: Insufficient permissions
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/audit/logs/{audit_log_id}:
    get:
      tags:
      - audit
      summary: Get audit log detail
      description: 获取单条审计日志详情。仅 doctor/admin 可访问。
      operationId: get_audit_log_detail_api_v1_audit_logs__audit_log_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: audit_log_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Audit Log Id
      responses:
        '200':
          description: Audit log returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogOut'
        '403':
          description: Insufficient permissions
        '404':
          description: Audit log not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/deletions/requests:
    post:
      tags:
      - deletions
      summary: Submit deletion request
      description: 提交胸片删除请求。普通用户仅可为自己上传的影像发起删除；doctor/admin 也可代表业务流程发起。
      operationId: submit_deletion_request_api_v1_deletions_requests_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionRequestCreate'
      responses:
        '201':
          description: Deletion request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequestOut'
        '400':
          description: Invalid delete mode or payload
        '403':
          description: User cannot request deletion for this image
        '404':
          description: Image not found
        '409':
          description: Pending deletion request already exists
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - deletions
      summary: List deletion requests
      description: 列出删除请求。doctor/admin 可查看全量请求，普通用户仅能查看自己发起的请求。
      operationId: get_deletion_requests_api_v1_deletions_requests_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: request_status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Status
      responses:
        '200':
          description: Deletion requests returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequestListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/deletions/requests/{deletion_request_id}/decision:
    post:
      tags:
      - deletions
      summary: Approve or reject deletion request
      description: 由 doctor/admin 审批删除请求。approve 会执行删除流程，reject 会保留拒绝原因与审批备注。
      operationId: review_deletion_request_api_v1_deletions_requests__deletion_request_id__decision_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: deletion_request_id
        in: path
        required: true
        schema:
          type: string
          title: Deletion Request Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionDecisionRequest'
      responses:
        '200':
          description: Deletion request processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequestOut'
        '400':
          description: Invalid action or missing rejection_reason
        '403':
          description: Insufficient permissions
        '404':
          description: Deletion request or image not found
        '409':
          description: Deletion request already processed
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reviews:
    post:
      tags:
      - reviews
      summary: Create Review
      operationId: create_review_api_v1_reviews_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/reviews/{prediction_id}:
    get:
      tags:
      - reviews
      summary: Get Review
      operationId: get_review_api_v1_reviews__prediction_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: prediction_id
        in: path
        required: true
        schema:
          type: string
          title: Prediction Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/model/version:
    get:
      tags:
      - model
      summary: Get Model Version
      operationId: get_model_version_api_v1_model_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersionResponse'
  /api/v1/model/metrics:
    get:
      tags:
      - model
      summary: Get Model Metrics
      operationId: get_model_metrics_api_v1_model_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelMetricsResponse'
  /api/v1/health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    AnalyzeRequest:
      properties:
        priority:
          type: string
          title: Priority
          default: normal
        requested_heatmaps:
          items:
            type: string
          type: array
          title: Requested Heatmaps
      type: object
      title: AnalyzeRequest
    AnalyzeResponse:
      properties:
        job_id:
          type: string
          format: uuid
          title: Job Id
        image_id:
          type: string
          format: uuid
          title: Image Id
        status:
          type: string
          title: Status
        disclaimer:
          type: string
          title: Disclaimer
          default: 本系统仅用于胸部 X 光影像的辅助筛查、辅助分诊和医生复核优先级排序，不用于自动诊断，不替代医生，不提供治疗建议。
      type: object
      required:
      - job_id
      - image_id
      - status
      title: AnalyzeResponse
    AuditLogListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditLogOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        disclaimer:
          type: string
          title: Disclaimer
          default: 本系统仅用于胸部 X 光影像的辅助筛查、辅助分诊和医生复核优先级排序，不用于自动诊断，不替代医生，不提供治疗建议。
      type: object
      required:
      - items
      - total
      title: AuditLogListResponse
    AuditLogOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        actor_user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Actor User Id
        action_type:
          type: string
          title: Action Type
        resource_type:
          type: string
          title: Resource Type
        resource_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Resource Id
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        ip_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip Hash
        user_agent:
          anyOf:
          - type: string
          - type: 'null'
          title: User Agent
        event_payload:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Event Payload
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        disclaimer:
          type: string
          title: Disclaimer
          default: 本系统仅用于胸部 X 光影像的辅助筛查、辅助分诊和医生复核优先级排序，不用于自动诊断，不替代医生，不提供治疗建议。
      type: object
      required:
      - id
      - actor_user_id
      - action_type
      - resource_type
      - resource_id
      - request_id
      - ip_hash
      - user_agent
      - event_payload
      - created_at
      - updated_at
      title: AuditLogOut
    Body_upload_cxr_api_v1_cxr_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_cxr_api_v1_cxr_upload_post
    DeleteImageRequest:
      properties:
        delete_mode:
          type: string
          title: Delete Mode
          default: soft
        reason:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Reason
      type: object
      title: DeleteImageRequest
    DeleteImageResponse:
      properties:
        image_id:
          type: string
          format: uuid
          title: Image Id
        request_status:
          type: string
          title: Request Status
        delete_mode:
          type: string
          title: Delete Mode
        deleted_by:
          type: string
          format: uuid
          title: Deleted By
        completed_at:
          type: string
          format: date-time
          title: Completed At
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        disclaimer:
          type: string
          title: Disclaimer
          default: 本系统仅用于胸部 X 光影像的辅助筛查、辅助分诊和医生复核优先级排序，不用于自动诊断，不替代医生，不提供治疗建议。
      type: object
      required:
      - image_id
      - request_status
      - delete_mode
      - deleted_by
      - completed_at
      title: DeleteImageResponse
    DeletionDecisionRequest:
      properties:
        approval_action:
          type: string
          title: Approval Action
          description: approve or reject
        approval_note:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Approval Note
        rejection_reason:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Rejection Reason
      type: object
      required:
      - approval_action
      title: DeletionDecisionRequest
      examples:
      - approval_action: approve
        approval_note: 已核对病例状态，允许执行软删除。
      - approval_action: reject
        approval_note: 建议保留影像用于审计追踪。
        rejection_reason: 该影像已进入医生复核流程，当前不允许删除。
    DeletionRequestCreate:
      properties:
        image_id:
          type: string
          format: uuid
          title: Image Id
        delete_mode:
          type: string
          title: Delete Mode
          default: soft
        reason:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Reason
      type: object
      required:
      - image_id
      title: DeletionRequestCreate
      example:
        delete_mode: soft
        image_id: 11111111-1111-1111-1111-111111111111
        reason: 影像上传错误，请求撤回并重新上传。
    DeletionRequestListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DeletionRequestOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        disclaimer:
          type: string
          title: Disclaimer
          default: 本系统仅用于胸部 X 光影像的辅助筛查、辅助分诊和医生复核优先级排序，不用于自动诊断，不替代医生，不提供治疗建议。
      type: object
      required:
      - items
      - total
      title: DeletionRequestListResponse
    DeletionRequestOut:
      properties:
        request_id:
          type: string
          format: uuid
          title: Request Id
        image_id:
          type: string
          format: uuid
          title: Image Id
        delete_mode:
          type: string
          title: Delete Mode
        deletion_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Deletion Reason
        request_status:
          type: string
          title: Request Status
        requested_by:
          type: string
          format: uuid
          title: Requested By
        approved_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Approved By
        approval_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Approval Note
        rejection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Rejection Reason
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        disclaimer:
          type: string
          title: Disclaimer
          default: 本系统仅用于胸部 X 光影像的辅助筛查、辅助分诊和医生复核优先级排序，不用于自动诊断，不替代医生，不提供治疗建议。
      type: object
      required:
      - request_id
      - image_id
      - delete_mode
      - deletion_reason
      - request_status
      - requested_by
      - approved_by
      - approval_note
      - rejection_reason
      - completed_at
      - created_at
      - updated_at
      title: DeletionRequestOut
    GradCAMGenerateResponse:
      properties:
        image_id:
          type: string
          format: uuid
          title: Image Id
        target_label:
          type: string
          title: Target Label
        heatmap_url:
          type: string
          title: Heatmap Url
        overlay_url:
          type: string
          title: Overlay Url
        notice:
          type: string
          title: Notice
          default: 模型在生成该风险提示时重点关注了以下区域。热力图仅用于辅助理解，不代表医学诊断依据。最终判断应由专业医生结合临床信息完成。
        disclaimer:
          type: string
          title: Disclaimer
